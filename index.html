function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    })[c]);
}

function searchResult() {
    const query = document.getElementById('regNo').value.trim().toLowerCase();
    const resultBox = document.getElementById('result');
    const errorBox = document.getElementById('error');

    resultBox.style.display = 'none';
    errorBox.style.display = 'none';

    if (!query) {
        errorBox.textContent = 'Please enter your Register Number.';
        errorBox.style.display = 'block';
        return;
    }

    const found = results.find(r => r.register.trim().toLowerCase() === query);

    if (!found) {
        errorBox.textContent = 'Register Number not found. Please check and enter the correct Register Number.';
        errorBox.style.display = 'block';
        return;
    }

    let rows = '';
    for (const [key, value] of Object.entries(found.data)) {
        if (String(value).trim() !== '') {
            rows += `<div class="row"><div class="label">${escapeHtml(key)}</div><div class="value">${escapeHtml(value)}</div></div>`;
        }
    }

    resultBox.innerHTML =
        `<div class="result-title">${escapeHtml(found.sheet)} — RESULT SCORE CARD</div>
         <div class="info">${rows}</div>`;
    resultBox.style.display = 'block';
}
